<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ditto | Research</title>
<meta name="description" content="Ditto is the AI companion that's always here. A fictional company from the game TokenVerse.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>

<!-- ========== NAV ========== -->
<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="assets/mark.png" alt="">
      <span class="name">Ditto</span>
    </a>
    <div class="nav-right">
      <a class="btn btn-primary try-btn" href="chat.html">Try Ditto <span>↗</span></a>
    </div>
  </div>
</header>

<!-- ========== HERO ========== -->
<section class="hero">
  <div class="hero-bg">
    <div class="grid"></div>
    <div class="glow"></div>
  </div>
  <div class="wrap">
    <div class="hero-copy">
      <span class="eyebrow">Ditto Companion · v3.7</span>
      <h1 class="hero-title">How can I help you today?</h1>

      <div class="chatbox" role="button" tabindex="0" aria-label="Message Ditto">
        <div class="chatbox-input">
          <input type="text" aria-label="Message Ditto" autocomplete="off" placeholder="">
          <span class="typed-hint"></span>
          <button class="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="pills">
        <button class="pill" data-q="I just want someone to talk to">Talk to me</button>
        <button class="pill" data-q="Help me feel less alone tonight">Feel less alone</button>
        <button class="pill" data-q="Tell me I did a good job today">Reassure me</button>
        <button class="pill" data-q="What can Ditto do?">What can Ditto do?</button>
      </div>
    </div>
  </div>
</section>

<!-- ========== CONNECTING BAND ========== -->
<!-- ========== MISSION BAND ========== -->
<section class="band">
  <div class="wrap">
    <div class="band-img reveal">
      <img src="assets/mission.png" alt="Ditto — let's explore, brainstorm, collaborate, create">
    </div>
    <h2 class="band-slogan reveal">Ditto listens, remembers, and stays</h2>
    <p class="band-sub reveal">Every message is a thread. Ditto weaves them together. Day or night, whenever you need someone.</p>
  </div>
</section>

<!-- ========== LEARN MORE CTA ========== -->
<section class="cta">
  <div class="wrap">
    <div class="cta-inner reveal">
      <h2>The Story Behind Ditto</h2>
      <a class="btn btn-primary btn-lg" href="https://tokenverse.cc">Read more <span>↗</span></a>
    </div>
  </div>
</section>

<!-- ========== FOOTER ========== -->
<footer class="footer">
  <div class="footer-bottom">
    <span>© 2026 Ditto corporation · a fiction by the TokenVerse team</span>
    <a href="https://tokenverse.cc/" aria-label="TokenVerse home"><img class="gt-logo" src="assets/tokenverse-mark.png" alt="TokenVerse" style="height:52px"></a>
  </div>
</footer>

<script src="main.js"></script>
</body>
</html>
